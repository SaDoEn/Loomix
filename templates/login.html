<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>[project_name] - Вхід</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; color: #00adb5; }
        input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #393e46; background: #1a1a1a; color: white; box-sizing: border-box; }
        .error-msg { color: #ff5252; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="container" style="width: 350px;">
        <h2>Вхід 🔑</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required placeholder="example@mail.com">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn" style="width: 100%; margin: 15px 0 0 0; cursor: pointer;">Увійти</button>
        </form>
        <div id="error" class="error-msg"></div>
        <p style="margin-top: 20px; font-size: 14px;">Немає акаунту? <a href="/register" style="color: #00adb5;">Реєстрація</a></p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('error');
            errorDiv.style.display = 'none';

            const formData = new FormData();
            formData.append('username', document.getElementById('email').value);
            formData.append('password', document.getElementById('password').value);

            try {
                const response = await fetch('/api/v1/users/login', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.access_token);

                    window.location.href = '/dashboard';
                } else {
                    errorDiv.innerText = data.detail || 'Невірний email або пароль';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.innerText = 'Сервер недоступний';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
