<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>[project_name] - Реєстрація</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; color: #00adb5; }
        input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #393e46; background: #1a1a1a; color: white; box-sizing: border-box; }
        .error-msg { color: #ff5252; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="container" style="width: 350px;">
        <h2>Реєстрація 🔐</h2>
        <form id="registerForm">
            <div class="form-group">
                <label>Ім'я користувача</label>
                <input type="text" id="username" required placeholder="Введи нікнейм">
            </div>
            <div class="form-group">
                <label>Тег (унікальний)</label>
                <input type="text" id="tag" required placeholder="наприклад: vitalii_40">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required placeholder="example@mail.com">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <div class="form-group">
                <label>Повтори пароль</label>
                <input type="password" id="password2" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn" style="width: 100%; margin: 15px 0 0 0; cursor: pointer;">Створити акаунт</button>
        </form>
        <div id="error" class="error-msg"></div>
        <p style="margin-top: 20px; font-size: 14px;">Вже маєш акаунт? <a href="/login" style="color: #00adb5;">Увійти</a></p>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('error');
            errorDiv.style.display = 'none';
            if (document.getElementById('password').value !== document.getElementById('password2').value) {
                errorDiv.innerText = 'Паролі не збігаються';
                errorDiv.style.display = 'block';
                return;
            }
            const payload = {
                username: document.getElementById('username').value,
                tag: document.getElementById('tag').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch('/api/v1/users/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    alert('Реєстрація успішна! Тепер увійдіть у свій акаунт.');
                    window.location.href = '/login';
                } else {
                    errorDiv.innerText = (Array.isArray(data.detail) ? data.detail[0].msg : data.detail) || 'Помилка реєстрації';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.innerText = 'Сервер недоступний';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
