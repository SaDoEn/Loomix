<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профіль користувача</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; min-height: 100vh; }

        .top-navbar {
            display: flex; justify-content: space-between; align-items: center;
            background-color: #1e1e1e; padding: 15px 30px; border-bottom: 1px solid #333;
            position: sticky; top: 0; z-index: 100;
        }

        .btn-back {
            background: none; border: none; color: #00bcd4; font-size: 16px;
            font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px;
        }

        .container { max-width: 935px; margin: 30px auto; padding: 0 20px; }

        .profile-card {
            background-color: #1e1e1e; border-radius: 12px; padding: 30px;
            text-align: center; margin-bottom: 30px; border: 1px solid #2a2a2a;
        }

        .avatar-container {
            width: 120px; height: 120px; margin: 0 auto 15px; border-radius: 50%;
            overflow: hidden; border: 3px solid #00bcd4; cursor: pointer;
        }
        .avatar-container img { width: 100%; height: 100%; object-fit: cover; }

        .username { font-size: 24px; font-weight: bold; margin-bottom: 12px; }
        .stats { display: flex; justify-content: center; gap: 20px; font-size: 15px; color: #aaa; margin-bottom: 20px; }
        .stats span { color: #fff; font-weight: bold; }

        .btn-follow {
            background-color: #00bcd4; color: #fff; border: none; padding: 10px 25px;
            font-size: 15px; font-weight: bold; border-radius: 6px; cursor: pointer;
        }
        .btn-follow.following { background-color: #333; color: #aaa; }

        .posts-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .post-card {
            aspect-ratio: 1 / 1; background-color: #2a2a2a; border-radius: 8px;
            overflow: hidden; cursor: pointer; position: relative;
        }
        .post-card img, .post-card video { width: 100%; height: 100%; object-fit: cover; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); display: flex; justify-content: center;
            align-items: center; z-index: 1000;
        }
        .modal-content {
            background: #1e1e1e; width: 90%; max-width: 1000px; height: 80vh;
            border-radius: 12px; display: flex; overflow: hidden; position: relative;
        }
        .close-btn {
            position: absolute; top: 15px; right: 20px; color: #fff; font-size: 28px;
            cursor: pointer; z-index: 1001;
        }

        .media-viewer-container {
            flex: 1.5; background: #000; display: flex; align-items: center;
            justify-content: center; position: relative;
        }
        .media-viewer-container img, .media-viewer-container video {
            max-width: 100%; max-height: 100%; object-fit: contain; cursor: zoom-in;
        }

        .nav-arrow {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(0,0,0,0.5); color: #fff; border: none;
            padding: 12px 16px; font-size: 20px; cursor: pointer; border-radius: 50%;
        }
        .prev-arrow { left: 15px; }
        .next-arrow { right: 15px; }

        .sidebar {
            flex: 1; display: flex; flex-direction: column; border-left: 1px solid #333; padding: 20px;
        }
        .author-header { display: flex; align-items: center; gap: 12px; padding-bottom: 15px; border-bottom: 1px solid #333; }
        .mini-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; cursor: pointer; }

        .post-caption { padding: 15px 0; border-bottom: 1px solid #2a2a2a; color: #ddd; font-size: 14px; }

        .comments-section { flex: 1; overflow-y: auto; padding: 15px 0; }
        .comment-item { margin-bottom: 12px; font-size: 14px; }
        .comment-user { font-weight: bold; color: #00bcd4; margin-right: 6px; }
        .comment-delete { margin-left: 10px; background: none; border: none; color: #6b7280; font-size: 12px; cursor: pointer; }
        .comment-delete:hover { color: #ff5252; }
        .actions-section { border-top: 1px solid #333; padding-top: 15px; }
        .like-btn {
            background: none; border: none; color: #fff; font-size: 22px;
            cursor: pointer; display: flex; align-items: center; gap: 8px; transition: transform 0.1s;
        }
        .like-btn.liked { color: #ff3040; }
        .like-btn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; }
        .like-btn.liked svg { fill: currentColor; }
        .like-btn:active { transform: scale(1.2); }

        .add-comment-box { display: flex; gap: 10px; margin-top: 15px; }
        .add-comment-box input {
            flex: 1; background: #2a2a2a; border: 1px solid #333; color: #fff;
            padding: 10px; border-radius: 6px; font-size: 14px;
        }
        .add-comment-box button {
            background: #00bcd4; border: none; color: #fff; padding: 0 15px;
            border-radius: 6px; font-weight: bold; cursor: pointer;
        }

        .lightbox-modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.95); display: flex; justify-content: center;
            align-items: center; z-index: 2000; cursor: zoom-out;
        }
        .lightbox-modal img { max-width: 95vw; max-height: 95vh; object-fit: contain; }
    </style>
</head>
<body>

    <header class="top-navbar">
        <button class="btn-back" onclick="goBack()">← Назад</button>
        <span style="color: #888;">Профіль користувача</span>
    </header>

    <div class="container">
        <div class="profile-card">
            <div class="avatar-container" onclick="openLightbox(document.getElementById('userAvatar').src)">
                <img id="userAvatar" src="https://placehold.co/150x150?text=Ava" alt="Avatar">
            </div>
            <h1 class="username" id="profileUsername">Завантаження...</h1>
            <p id="profileTag" style="color: #a0aec0; margin: 0 0 10px 0;"></p>
            <div class="stats">
                <div style="cursor:pointer" onclick="showList('followers')"><span id="followers-count">0</span> Підписників</div>
                <div style="cursor:pointer" onclick="showList('following')"><span id="following-count">0</span> Підписок</div>
            </div>
            <button id="btnFollow" class="btn-follow" onclick="toggleFollow()">Підписатися</button>
        </div>

        <div id="postsGrid" class="posts-grid"></div>
    </div>

    <div id="mediaModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <span class="close-btn" onclick="closeMediaModal()">&times;</span>

            <div class="media-viewer-container">
                <button class="nav-arrow prev-arrow" onclick="navigateMedia(-1)">❮</button>
                <div id="modalMediaContent" style="width: 100%; height: 100%; display: flex; justify-content: center; align-items: center;"></div>
                <button class="nav-arrow next-arrow" onclick="navigateMedia(1)">❯</button>
            </div>

            <div class="sidebar">
                <div class="author-header">
                    <img id="modalAuthorAvatar" class="mini-avatar" src="" onclick="openLightbox(this.src)">
                    <span id="modalAuthorName" style="font-weight: bold;"></span>
                </div>

                <div id="modalCaption" class="post-caption"></div>

                <div class="comments-section" id="commentsList">
                </div>

                <div class="actions-section">
                    <button id="likeBtn" class="like-btn" onclick="toggleLike()">
                        <svg id="heartIcon" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg> <span id="likesCount">0</span>
                    </button>

                    <div class="add-comment-box">
                        <input type="text" id="commentInput" placeholder="Додати коментар..." onkeydown="if (event.key === 'Enter') submitComment()">
                            <button onclick="submitComment()">Надіслати</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

<div id="users-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); align-items:center; justify-content:center; z-index:1000;">
    <div style="background:#2a2a2a; padding:20px; border-radius:8px; width:300px; color:#fff;">
        <h3 id="modal-title" style="margin-top:0; color:#00adb5;">Список</h3>
        <ul id="users-list" style="list-style:none; padding:0; max-height:250px; overflow-y:auto;"></ul>
        <button onclick="document.getElementById('users-modal').style.display='none'" style="background:#ff4d4d; color:#fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; margin-top:10px; width:100%;">Закрити</button>
    </div>
</div>

    <div id="lightbox" class="lightbox-modal" style="display: none;" onclick="closeLightbox()">
        <img id="lightboxImg" src="">
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const targetUserId = urlParams.get('id');
        let userPosts = [];
        let currentIndex = 0;
        let isFollowing = false;

        function goBack() {
            if (document.referrer && document.referrer.includes(window.location.host)) {
                window.history.back();
            } else {
                window.location.href = '/dashboard';
            }
        }

        async function loadProfile() {
            const token = localStorage.getItem('token');
            if (!targetUserId) { window.location.href = '/dashboard'; return; }

            try {
                const res = await fetch(`/api/v1/users/${targetUserId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('profileUsername').innerText = data.username;
                    document.getElementById('profileTag').innerText = '@' + data.tag;
                    document.getElementById('followers-count').innerText = data.followers_count || 0;
                    document.getElementById('following-count').innerText = data.following_count || 0;

                    if (data.avatar_url) {
                        document.getElementById('userAvatar').src = `http://localhost:9000/media/${data.avatar_url}`;
                    }
                    isFollowing = data.is_following;
                    updateFollowButton();
                }

                loadUserPosts();
            } catch (err) { console.error(err); }
        }

        function updateFollowButton() {
            const btn = document.getElementById('btnFollow');
            btn.innerText = isFollowing ? 'Відписатися' : 'Підписатися';
            btn.classList.toggle('following', isFollowing);
        }

        async function toggleFollow() {
            const token = localStorage.getItem('token');
            const endpoint = isFollowing ? `/api/v1/users/${targetUserId}/unfollow` : `/api/v1/users/${targetUserId}/follow`;

            const res = await fetch(endpoint, { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } });
            if (res.ok) {
                isFollowing = !isFollowing;
                let elem = document.getElementById('followers-count');
                elem.innerText = isFollowing ? parseInt(elem.innerText) + 1 : Math.max(0, parseInt(elem.innerText) - 1);
                updateFollowButton();
            }
        }

        async function loadUserPosts() {
            const token = localStorage.getItem('token');
            const res = await fetch(`/api/v1/media/user-posts/${targetUserId}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (res.ok) {
                userPosts = await res.json();
                const container = document.getElementById('postsGrid');
                container.innerHTML = '';

                userPosts.forEach((post, index) => {
                    const isVideo = post.file_url.endsWith('.mp4') || post.file_url.endsWith('.webm');
                    const html = `
                        <div class="post-card" onclick="openMediaModal(${index})">
                            ${isVideo
                                ? `<video src="http://localhost:9000/media/${post.file_url}"></video>`
                                : `<img src="http://localhost:9000/media/${post.file_url}">`}
                        </div>`;
                    container.innerHTML += html;
                });
            }
        }

        function openMediaModal(index) {
            currentIndex = index;
            const post = userPosts[currentIndex];
            const modal = document.getElementById('mediaModal');

            document.getElementById('modalAuthorName').innerText = document.getElementById('profileUsername').innerText;
            document.getElementById('modalAuthorAvatar').src = document.getElementById('userAvatar').src;
            document.getElementById('modalCaption').innerText = post.title + (post.description ? ` — ${post.description}` : '');

            document.getElementById('commentInput').value = '';
            renderMediaContent(post);
            loadComments(post.id);

            modal.style.display = 'flex';
        }

        function renderMediaContent(post) {
            const container = document.getElementById('modalMediaContent');
            const fullUrl = `http://localhost:9000/media/${post.file_url}`;
            const isVideo = post.file_url.endsWith('.mp4') || post.file_url.endsWith('.webm');

            if (isVideo) {
                container.innerHTML = `<video src="${fullUrl}" controls autoplay></video>`;
                const video = container.querySelector('video');
                video.volume = parseFloat(localStorage.getItem('videoVolume') ?? 1);
                video.muted = localStorage.getItem('videoMuted') === 'true';
                video.addEventListener('volumechange', () => {
                    localStorage.setItem('videoVolume', video.volume);
                    localStorage.setItem('videoMuted', video.muted);
                });
            } else {
                container.innerHTML = `<img src="${fullUrl}" onclick="openLightbox('${fullUrl}')">`;
            }

            document.getElementById('likesCount').innerText = post.likes_count || 0;
            document.getElementById('likeBtn').classList.toggle('liked', !!post.is_liked);
        }

        function navigateMedia(dir) {
            currentIndex += dir;
            if (currentIndex < 0) currentIndex = userPosts.length - 1;
            if (currentIndex >= userPosts.length) currentIndex = 0;
            openMediaModal(currentIndex);
        }

        function closeMediaModal() {
            document.getElementById('mediaModal').style.display = 'none';
            document.getElementById('modalMediaContent').innerHTML = '';
        }

        async function toggleLike() {
            const token = localStorage.getItem('token');
            const post = userPosts[currentIndex];

            const res = await fetch(`/api/v1/media/${post.id}/like`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (res.ok) {
                const data = await res.json();
                post.is_liked = data.is_liked;
                post.likes_count = data.likes_count;
                renderMediaContent(post);
            }
        }

        async function loadComments(mediaId) {
            const token = localStorage.getItem('token');
            const res = await fetch(`/api/v1/media/${mediaId}/comments`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!res.ok) return;

            const comments = await res.json();
            const list = document.getElementById('commentsList');
            list.innerHTML = '';

            comments.forEach(c => {
                const row = document.createElement('div');
                row.className = 'comment-item';

                const user = document.createElement('span');
                user.className = 'comment-user';
                user.textContent = c.username + ':';

                const text = document.createElement('span');
                text.textContent = c.text;

                row.append(user, text);

                if (c.can_delete) {
                    const del = document.createElement('button');
                    del.className = 'comment-delete';
                    del.textContent = 'видалити';
                    del.onclick = () => deleteComment(c.id);
                    row.append(del);
                }
                list.append(row);
            });
        }

        async function deleteComment(commentId) {
            const token = localStorage.getItem('token');
            const post = userPosts[currentIndex];
            const res = await fetch(`/api/v1/media/${post.id}/comments/${commentId}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) loadComments(post.id);
        }

        async function submitComment() {
            const input = document.getElementById('commentInput');
            const text = input.value.trim();
            if (!text) return;

            const token = localStorage.getItem('token');
            const post = userPosts[currentIndex];

            const res = await fetch(`/api/v1/media/${post.id}/comments`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ text })
            });

            if (res.ok) {
                input.value = '';
                loadComments(post.id);
            }
        }

        function openLightbox(url) {
            document.getElementById('lightboxImg').src = url;
            document.getElementById('lightbox').style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }

        document.addEventListener('DOMContentLoaded', loadProfile);

        function esc(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        async function showList(kind) {
            const token = localStorage.getItem('token');
            const res = await fetch(`/api/v1/subscriptions/subscriptions/${targetUserId}/${kind}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!res.ok) return;

            const users = await res.json();
            document.getElementById('modal-title').innerText = kind === 'followers' ? 'Підписники' : 'Підписки';
            const list = document.getElementById('users-list');
            list.innerHTML = users.length ? '' : '<li style="color:#a0aec0; padding:10px 0;">Список порожній</li>';
            users.forEach(u => {
                list.innerHTML += `<li onclick="window.location.href='/public_profile?id=${u.id}'" style="cursor:pointer; padding:8px 0; border-bottom:1px solid #3a3a3a;">
                    👤 <strong>${esc(u.username)}</strong> <span style="color:#a0aec0;">@${esc(u.tag)}</span></li>`;
            });
            document.getElementById('users-modal').style.display = 'flex';
        }
    </script>
</body>
</html>
